services:
  db:
    image: postgres:17
    container_name: chartmaker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - chartmaker-db:/var/lib/postgresql/data

volumes:
  chartmaker-db: